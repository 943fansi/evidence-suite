# Source Registry 优先级知识库（registry = 优先级清单，不是白名单）
#
# 配套 select_sources.py --allow-discovery：
#   registry 来源（origin=registry）按其 authority/priority 优先排序进入候选池；
#   未入册但被检索到的来源（origin=discovered，含厂商报告/国家实验室/会议论文等）
#   允许进入候选池，并按权威分级后参与竞争——"没进 Registry ≠ 不是好证据"。
#
# 结构：default_by_category 提供按 category 的默认分级；sources 提供按 id 的覆盖
# （id 覆盖优先）。authority 复用 A1–D2 体系；priority 0–100，越高越优先。
# 规则文件为块式 YAML，内置最小解析器可读。

default_by_category:
  international_regulator:
    authority: "A1"
    priority: 100
    role: [normative, safety]
  china_regulator:
    authority: "A1"
    priority: 95
    role: [normative, safety]
  international_standard:
    authority: "A2"
    priority: 90
    role: [normative]
  china_standard:
