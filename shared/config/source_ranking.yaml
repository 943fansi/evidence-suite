  # 聚合站快照不作正式引用依据，须回原刊或 doi.org 核对后引用）
  cnki:
    authority: "C1"
    priority: 62
    role: [discovery, literature, cn_journal]
    note: "知网：中文期刊题录/卷期页/作者核对入口；正式引用回原刊"
