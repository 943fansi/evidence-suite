# evidence-suite 规则配置（默认档）
#
# 单一事实来源：本文件集中定义 claim_class / risk tier / authority / 文档下限 /
# 可疑域名 / 停止规则等可调参数。SKILL.md 与 claim_evidence_layer.md 引用本文件，
# 脚本（validate_sources.py / check_citations.py）通过 --profile / --rules 读取。
#
# 覆盖方式（优先级从低到高）：
#   1. shared/config/rules.yaml          ← 本默认档（仓库自带）
#   2. <SUITE_ROOT>/config/rules.user.yaml  ← 仓库级用户覆盖（自动加载，可 gitignore）
#   3. --rules <path>                    ← 显式指定覆盖文件
#   4. --profile <scenario>              ← 场景档（deep-merge 覆盖上述结果）
#
# 注意：本文件使用块式 YAML（无 flow mapping {…}），保证无 pyyaml 环境下
#       内置最小解析器也能正确加载；请勿引入行内 {…} 结构。

schema_version: "0.1.0"

# 场景档：对同一规则的整体微调（deep-merge）。
#   medical       高险场景：提高权威要求与来源下限
#   general_tech  普通技术调研：放宽部分来源权威要求与下限
scenario_profiles:
  medical:
    risk_tiers:
      R2:
        authority_min: "A2"
        live: true
      R3:
        authority_min: "A1"
        live: true
    doc_minimums:
      paper_journal:
        min_sources: 20
        min_chars: 5000
      report_survey:
        min_sources: 30
        min_chars: 12000
    suspect_domains_extra:
      - jianshu.com
      - toutiao.com
      - zhihu.com
  general_tech:
    risk_tiers:
      R3:
        authority_min: "B1"
        live: false
    doc_minimums:
      proposal:
        min_sources: 10
        min_chars: 4000
      report_survey:
        min_sources: 15
        min_chars: 6000
      whitepaper:
        min_sources: 8
        min_chars: 3000
    stop_rule:
      max_extra_before_diminishing: 6

# Risk Tier → 证据要求（默认档）。claim_evidence_layer.md 的 Risk Tier 表以此为源。
#   evidence        该风险级要求的证据形态
#   authority_min   来源权威最低要求（R3/R4 的 authority 约束依据）
#   live            是否要求 live 回源
risk_tiers:
  R0:
    evidence: "none"
    authority_min: ""
    live: false
  R1:
    evidence: "static_single"
    authority_min: ""
    live: false
  R2:
    evidence: "cross_2"
    authority_min: "B1"
    live: false
  R3:
    evidence: "primary_live"
    authority_min: "A2"
    live: true
  R4:
    evidence: "independent_review"
    authority_min: "A1"
    live: true

# claim_class 是否需要外部来源（默认档；非证据类 D/C/U/J 走一致性/可复现/标注/推理链检查）
claim_classes:
  E:
    needs_source: true
    check: "source"
  M:
    needs_source: true
    check: "source"
  N:
    needs_source: true
    check: "source_current"
  L:
    needs_source: true
    check: "source"
  D:
    needs_source: false
    check: "consistency"
  C:
    needs_source: false
    check: "reproducible"
  U:
    needs_source: false
    check: "annotated"
  J:
    needs_source: false
    check: "reasoning_chain"

# claim-weighted evidence sufficiency（证据充分性，按 claim 的 risk tier 逐条判定）
#
# 文档级 doc_minimums.min_sources 只是「写作格式下限」（院校/期刊/机构要求），
# 不是证据质量代理；证据是否足够由 check_evidence_sufficiency.py 按 claim 判定。
#   min_primary_sources      该 risk 至少需要几条 primary 来源
#                             （primary = authority ∈ {A1,A2,A3,B1,B2}）
#   min_independent_sources  至少需要几条独立来源（按 source_id 去重计）
#   live                     该 risk 是否要求 live 回源 / 现行性核验
#   contradiction_coverage   是否要求显式反证覆盖
#                             （counter_evidence 非空，或 counter_evidence_search
#                               已记录"本次检索未找到公开反证"负结果）
evidence_sufficiency:
  R0:
    min_primary_sources: 0
    min_independent_sources: 0
    live: false
    contradiction_coverage: false
  R1:
    min_primary_sources: 0
    min_independent_sources: 1
    live: false
    contradiction_coverage: false
  R2:
    min_primary_sources: 1
    min_independent_sources: 2
    live: false
    contradiction_coverage: true
  R3:
    min_primary_sources: 1
    min_independent_sources: 2
    live: true
    contradiction_coverage: true
  R4:
    min_primary_sources: 2
    min_independent_sources: 2
    live: true
    contradiction_coverage: true

# 审查模式（Risk-adaptive review）。核安全/法规场景默认 conservative；
# 通用研究可用 balanced；探索/低风险可用 exploratory。
#   evidence_multiplier  对 evidence_sufficiency 的 primary/独立来源阈值乘数
#   default_presumption  审查者默认立场（guilty=有罪推定 / neutral=中立）
#   live_for_all         是否对全部 claim 强制 live 回源
review_mode: balanced
review_modes:
  conservative:
    evidence_multiplier: 1.5
    default_presumption: guilty
    live_for_all: true
  balanced:
    evidence_multiplier: 1.0
    default_presumption: guilty
    live_for_all: false
  exploratory:
    evidence_multiplier: 0.7
    default_presumption: neutral
    live_for_all: false

# 文档类型 → 来源数 / 正文深度下限（SKILL.md「参考文献数量下限」表以此为源）
doc_minimums:
  proposal:
    min_sources: 15
    min_chars: 6000
  thesis_ug:
    min_sources: 20
    min_chars: 10000
  report_survey:
    min_sources: 25
    min_chars: 10000
  report_feasibility:
    min_sources: 15
    min_chars: 6000
  whitepaper:
    min_sources: 12
    min_chars: 5000
  report_gf:
    min_sources: 12
    min_chars: 10000
  plan_implementation:
    min_sources: 12
    min_chars: 8000
  paper_journal:
    min_sources: 15
    min_chars: 4000
  patent_disclosure:
    min_sources: 8
    min_chars: 5000
  patent_application:
    min_sources: 8
    min_chars: 5000
  thesis_ms:
    min_sources: 40
    min_chars: 20000
  thesis_phd:
    min_sources: 60
    min_chars: 35000

# 可疑域名（validate_sources.py 语料自检用；场景档可用 suspect_domains_extra 追加）
suspect_domains:
  - bjjcyjy
  - antpedia
  - stm-publishing
  - baike.baidu
  - baike.com
  - zhihu.com
  - q.wenku
  - wenku.baidu
  - docin.com
  - doc88.com
  - wikipedia
  - futunn
  - openai.com/blog
  - anthropic.com/research
  - samaltman
  - 36kr
  - jiqizhixin
  - sohu.com
  - 163.com
  - toutiao

# Evidence Stop Rule（证据停止规则参数）
stop_rule:
  max_extra_before_diminishing: 5
  diversity_min_independent_countries: 2
  counter_search_terms:
    - criticism
    - limitation
    - contradictory
    - failed
    - 质疑
    - 局限
    - 反例
    - 争议
    - 失效

# 权威来源分级说明（A1–D2，供文档引用；脚本不消费）
authority_definitions:
  A1: "法规/监管机构"
  A2: "国际组织/标准组织"
  A3: "国家/行业标准"
  B1: "官方技术报告"
  B2: "原始实验/工程报告"
  C1: "同行评审论文"
  C2: "学位论文"
  D1: "厂商资料"
  D2: "二手资料"
