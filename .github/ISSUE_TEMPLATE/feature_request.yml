name: Feature 请求
description: 新能力 / 规则 / 集成 / 文档
title: "[feature] 简述"
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 解决的问题（为什么需要）
      description: 说明现有能力的缺口与使用场景
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望行为 / 方案
      description: 尽量具体：CLI 形态、配置项、对 manifest/导出物/术语速查的影响
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 涉及范围（可多选）
      multiple: true
      options:
        - 规则（rules.yaml / 场景档）
        - 脚本（shared/scripts）
        - 契约（schemas / validate_manifest）
        - 导出（PDF / DOCX / manifest / provenance）
        - 安全 / 网络
        - 文档 / Skill 提示
        - 评测（eval / golden / benchmark）
  - type: checkboxes
    id: impact
    attributes:
      label: 已知影响面（如有）
      options:
        - label: 需要递增 schema_version 并提供迁移
        - label: 需要更新 SECURITY.md 白名单 / THREAT_MODEL.md
        - label: 需要新增 golden 用例或回归用例
  - type: textarea
    id: notes
    attributes:
      label: 补充说明
