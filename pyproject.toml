[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-suite-core"
version = "0.2.1"
description = "研究 Agent 的证据校验与溯源层：Claim 级证据审计 + Evidence Manifest 互操作契约（evidence-suite 核心脚本）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["evidence", "citation", "llm", "research-agent", "fact-checking"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
pdf = ["pdfplumber", "PyPDF2"]
export = ["python-docx", "markdown", "weasyprint"]
yaml = ["PyYAML"]

[project.scripts]
evidence-suite = "evidence_suite:main"

[tool.setuptools]
# evidence-suite.py 与 evidence_boundary.py 位于 shared/scripts/，作为顶层模块打包；
# 脚本依赖 shared/schemas、shared/config、shared/templates 等资产时需以仓库路径运行
#（PR-06 打包资源包另见 docs/roadmap.md）。
package-dir = { "" = "shared/scripts" }
py-modules = ["evidence_suite", "evidence_boundary"]
